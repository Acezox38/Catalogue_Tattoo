<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obsidian Studio — Catalogue des tatouages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Courier+Prime:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #131110;
    --paper-dark: #1D1916;
    --ink: #EAE1C8;
    --ink-blue: #D4AF37;
    --stamp-red: #B5772E;
    --gold: #D4AF37;
    --line: rgba(212,175,55,0.22);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;}
  body{
    font-family:'Work Sans', sans-serif;
    color:var(--ink);
    min-height:100vh;
    background:
      radial-gradient(ellipse at top left, rgba(212,175,55,0.10), transparent 55%),
      var(--paper);
    background-attachment:fixed;
  }
  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(212,175,55,0.02) 0px, rgba(212,175,55,0.02) 1px, transparent 1px, transparent 3px);
    opacity:.5;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:36px 24px 80px;position:relative;z-index:1;}

  /* HEADER */
  header{
    display:flex; align-items:flex-end; justify-content:space-between;
    gap:20px; flex-wrap:wrap;
    border-bottom:3px solid var(--ink-blue);
    padding-bottom:18px; margin-bottom:8px;
  }
  .title-block h1{
    font-family:'Rye', serif;
    font-size:clamp(2.1rem, 5vw, 3.4rem);
    margin:0; letter-spacing:1px; line-height:1;
    color:var(--ink-blue);
    text-shadow: 0 0 18px rgba(212,175,55,0.35);
  }
  .title-block .sub{
    font-family:'Courier Prime', monospace;
    font-size:.78rem; letter-spacing:2px; text-transform:uppercase;
    color:var(--stamp-red); margin-top:6px;
  }
  .stats{
    font-family:'Courier Prime', monospace;
    font-size:.8rem; text-align:right; line-height:1.7;
    color:var(--ink); opacity:.75;
  }
  .stats b{color:var(--ink-blue); font-size:1rem;}

  /* TOOLBAR */
  .toolbar{
    display:flex; gap:14px; flex-wrap:wrap; align-items:center;
    margin:22px 0 26px;
  }
  .search-box{
    flex:1; min-width:200px; position:relative;
  }
  .search-box input{
    width:100%; padding:11px 14px; font-family:'Work Sans';
    font-size:.92rem; border:1.5px solid var(--line); background:var(--paper-dark);
    border-radius:2px; color:var(--ink);
  }
  .search-box input::placeholder{color:var(--ink); opacity:.45;}
  .search-box input:focus{outline:2px solid var(--ink-blue); outline-offset:1px;}
  .chips{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{
    font-family:'Courier Prime', monospace; font-size:.72rem; letter-spacing:.5px;
    text-transform:uppercase; padding:7px 13px; border:1.5px solid var(--ink-blue);
    border-radius:20px; cursor:pointer; background:transparent; color:var(--ink-blue);
    transition:all .15s;
  }
  .chip:hover{background:rgba(212,175,55,0.1);}
  .chip.active{background:var(--ink-blue); border-color:var(--ink-blue); color:var(--paper);}
  .add-btn{
    font-family:'Courier Prime', monospace; font-weight:700; letter-spacing:1px;
    text-transform:uppercase; font-size:.82rem;
    background:var(--ink-blue); color:var(--paper); border:none;
    padding:12px 20px; border-radius:2px; cursor:pointer;
    box-shadow: 3px 3px 0 rgba(212,175,55,0.3);
    transition:transform .12s;
  }
  .add-btn:hover{transform:translate(-1px,-1px); box-shadow:4px 4px 0 rgba(212,175,55,0.4);}
  .add-btn:active{transform:translate(1px,1px); box-shadow:1px 1px 0 rgba(212,175,55,0.4);}
  .filter-row{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    margin-bottom:12px;
  }
  .filter-label{
    font-family:'Courier Prime', monospace; font-size:.7rem; letter-spacing:1.5px;
    text-transform:uppercase; color:var(--ink); opacity:.5; min-width:44px;
  }

  /* GRID */
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr));
    gap:26px;
  }
  .empty-state{
    grid-column:1/-1; text-align:center; padding:70px 20px;
    font-family:'Courier Prime', monospace; color:var(--ink); opacity:.55;
  }
  .empty-state span{display:block; font-family:'Rye'; font-size:1.6rem; color:var(--ink-blue); opacity:1; margin-bottom:10px;}

  .card{
    background:var(--paper-dark);
    border:1.5px solid var(--ink-blue);
    position:relative; cursor:pointer;
    padding:14px 14px 16px;
    transform:rotate(var(--r,0deg));
    box-shadow: 0 3px 0 rgba(212,175,55,0.08);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .card:nth-child(3n+1){--r:-0.6deg;}
  .card:nth-child(3n+2){--r:0.5deg;}
  .card:nth-child(3n){--r:-0.3deg;}
  .card:hover{transform:rotate(0deg) translateY(-4px); box-shadow:0 10px 22px rgba(212,175,55,0.16);}
  .card::after{
    content:""; position:absolute; inset:5px;
    border:1px dashed rgba(212,175,55,0.3); pointer-events:none;
  }
  .badge{
    position:absolute; top:-10px; left:-10px;
    width:38px; height:38px; border-radius:50%;
    background:var(--ink-blue); color:var(--paper);
    display:flex; align-items:center; justify-content:center;
    font-family:'Courier Prime'; font-weight:700; font-size:.78rem;
    border:2px solid var(--paper); box-shadow:0 2px 5px rgba(0,0,0,0.5);
    z-index:2;
  }
  .thumb{
    width:100%; aspect-ratio:1/1; background:var(--paper);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; margin-bottom:12px; border:1px solid var(--line);
  }
  .thumb img{width:100%; height:100%; object-fit:cover; filter:contrast(1.05) brightness(.97);}
  .thumb svg{width:46%; opacity:.55;}
  .card h3{
    font-family:'Rye'; font-size:1.15rem; margin:0 0 6px; color:var(--ink);
    line-height:1.15;
  }
  .meta-line{
    font-family:'Courier Prime', monospace; font-size:.72rem;
    color:var(--stamp-red); text-transform:uppercase; letter-spacing:.5px;
    margin-bottom:3px;
  }
  .meta-line.muted{color:var(--ink); opacity:.55;}

  /* MODAL */
  .overlay{
    position:fixed; inset:0; background:rgba(5,4,3,0.82);
    display:none; align-items:center; justify-content:center;
    padding:20px; z-index:50;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--paper-dark); border:2px solid var(--ink-blue);
    max-width:560px; width:100%; max-height:88vh; overflow-y:auto;
    padding:28px 26px; position:relative;
    box-shadow:0 0 0 1px rgba(212,175,55,0.15), 8px 8px 24px rgba(0,0,0,0.5);
  }
  .modal h2{font-family:'Rye'; color:var(--ink-blue); margin:0 0 18px; font-size:1.7rem;}
  .close-x{
    position:absolute; top:16px; right:18px; background:none; border:none;
    font-size:1.4rem; cursor:pointer; color:var(--ink); font-family:'Courier Prime';
    line-height:1;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block; font-family:'Courier Prime'; font-size:.72rem;
    text-transform:uppercase; letter-spacing:1px; color:var(--ink-blue);
    margin-bottom:5px;
  }
  .field input, .field select, .field textarea{
    width:100%; padding:9px 11px; border:1.5px solid var(--line);
    background:var(--paper); font-family:'Work Sans'; font-size:.9rem; border-radius:2px;
    color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:1.5px solid var(--ink-blue); outline-offset:0;
  }
  .field textarea{resize:vertical; min-height:60px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .modal-actions{display:flex; justify-content:space-between; align-items:center; margin-top:20px; gap:10px;}
  .btn{
    font-family:'Courier Prime'; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
    font-size:.78rem; padding:10px 18px; border:1.5px solid var(--ink-blue); cursor:pointer;
    border-radius:2px; background:transparent; color:var(--ink-blue);
  }
  .btn.primary{background:var(--ink-blue); border-color:var(--ink-blue); color:var(--paper);}
  .btn.danger{background:transparent; border-color:var(--stamp-red); color:var(--stamp-red);}
  .btn.danger:hover{background:var(--stamp-red); color:var(--paper);}

  /* DETAIL VIEW */
  .detail-img{
    width:100%; max-height:280px; object-fit:cover; border:1px solid var(--ink-blue);
    margin-bottom:16px; background:var(--paper);
  }
  .detail-meta{
    display:grid; grid-template-columns:1fr 1fr; gap:10px 18px;
    font-family:'Work Sans'; font-size:.88rem; margin-bottom:14px;
  }
  .detail-meta div span{
    display:block; font-family:'Courier Prime'; font-size:.68rem; text-transform:uppercase;
    letter-spacing:1px; color:var(--stamp-red); margin-bottom:2px;
  }
  .detail-notes{font-size:.9rem; line-height:1.55; border-top:1px dashed var(--line); padding-top:12px;}

  @media (prefers-reduced-motion: reduce){
    .card, .add-btn{transition:none;}
  }
  @media (max-width:600px){
    .row2{grid-template-columns:1fr;}
    header{flex-direction:column; align-items:flex-start;}
    .stats{text-align:left;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-block">
      <h1>Obsidian Studio</h1>
      <div class="sub">Catalogue des tatouages</div>
    </div>
    <div class="stats" id="stats">Chargement…</div>
  </header>

  <div class="toolbar">
    <div class="search-box">
      <input type="text" id="search" placeholder="Chercher un tatouage, un·e artiste, un style…">
    </div>
    <button class="add-btn" id="openAdd">+ Ajouter une pièce</button>
  </div>

  <div class="filter-row">
    <span class="filter-label">Zone</span>
    <div class="chips" id="categoryChips"></div>
  </div>
  <div class="filter-row">
    <span class="filter-label">Style</span>
    <div class="chips" id="styleChips"></div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<!-- Modal Add/Edit -->
<div class="overlay" id="formOverlay">
  <div class="modal">
    <button class="close-x" id="closeForm">✕</button>
    <h2 id="formTitle">Nouvelle pièce</h2>
    <form id="tattooForm">
      <div class="field">
        <label>Titre</label>
        <input type="text" id="f-title" required placeholder="Ex : Hirondelle, Petit serpent…">
      </div>
      <div class="field">
        <label>URL de la photo (optionnel)</label>
        <input type="url" id="f-image" placeholder="https://…">
      </div>
      <div class="row2">
        <div class="field">
          <label>Zone du corps</label>
          <select id="f-category">
            <option>Tête</option>
            <option>Cou</option>
            <option>Bras</option>
            <option>Torse/Ventre</option>
            <option>Dos</option>
            <option>Jambes</option>
          </select>
        </div>
        <div class="field">
          <label>Style</label>
          <select id="f-style">
            <option>Fine line</option>
            <option>Traditionnel</option>
            <option>Old school</option>
            <option>Réaliste</option>
            <option>Blackwork</option>
            <option>Japonais</option>
            <option>Géométrique</option>
            <option>Aquarelle</option>
            <option>Lettrage</option>
            <option>Autre</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Emplacement précis</label>
        <input type="text" id="f-placement" placeholder="Avant-bras droit, omoplate gauche…">
      </div>
      <div class="row2">
        <div class="field">
          <label>Artiste</label>
          <input type="text" id="f-artist" placeholder="Nom de l'artiste">
        </div>
        <div class="field">
          <label>Studio</label>
          <input type="text" id="f-studio" placeholder="Nom du studio">
        </div>
      </div>
      <div class="field">
        <label>Date</label>
        <input type="date" id="f-date">
      </div>
      <div class="field">
        <label>Notes / histoire</label>
        <textarea id="f-notes" placeholder="Ce que ça représente, le déroulé de la séance…"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn danger" id="deleteBtn" style="display:none;">Supprimer</button>
        <div style="flex:1;"></div>
        <button type="button" class="btn" id="cancelForm">Annuler</button>
        <button type="submit" class="btn primary">Enregistrer</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal Detail -->
<div class="overlay" id="detailOverlay">
  <div class="modal">
    <button class="close-x" id="closeDetail">✕</button>
    <h2 id="d-title"></h2>
    <img class="detail-img" id="d-image" style="display:none;">
    <div class="detail-meta">
      <div><span>Zone</span><div id="d-category">—</div></div>
      <div><span>Emplacement</span><div id="d-placement">—</div></div>
      <div><span>Style</span><div id="d-style">—</div></div>
      <div><span>Artiste</span><div id="d-artist">—</div></div>
      <div><span>Studio</span><div id="d-studio">—</div></div>
      <div><span>Date</span><div id="d-date">—</div></div>
    </div>
    <div class="detail-notes" id="d-notes"></div>
    <div class="modal-actions">
      <div style="flex:1;"></div>
      <button class="btn" id="editFromDetail">Modifier</button>
    </div>
  </div>
</div>

<script>
(function(){
  let tattoos = [];
  let activeStyle = null;
  let activeCategory = null;
  let editingId = null;
  let viewingId = null;
  const CATEGORIES = ['Tête','Cou','Bras','Torse/Ventre','Dos','Jambes'];

  const SUPABASE_URL = 'https://bdczvfbvnsfdhsjpdyuz.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_r1ZBexLQfHlvFfmeg1lJTA_7XpqmAlO';
  const TABLE = 'tattoos';

  async function supa(path, options={}){
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      ...options,
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': options.prefer || 'return=representation',
        ...(options.headers || {})
      }
    });
    if(!res.ok){
      const text = await res.text().catch(() => '');
      throw new Error(`Supabase ${res.status}: ${text}`);
    }
    if(res.status === 204) return null;
    return res.json();
  }

  const grid = document.getElementById('grid');
  const statsEl = document.getElementById('stats');
  const chipsEl = document.getElementById('styleChips');
  const categoryChipsEl = document.getElementById('categoryChips');
  const searchInput = document.getElementById('search');

  const needleSVG = `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M20 80 L70 30" stroke="#D4AF37" stroke-width="4" stroke-linecap="round"/>
    <circle cx="74" cy="26" r="7" fill="#D4AF37"/>
    <path d="M20 80 L28 88 M20 80 L12 88" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
  </svg>`;

  async function load(){
    grid.innerHTML = `<div class="empty-state"><span>Ouverture du carnet…</span>Chargement du catalogue</div>`;
    try{
      tattoos = await supa(`${TABLE}?select=*&order=id.desc`, { method:'GET' });
    }catch(e){
      console.error('Erreur de chargement', e);
      tattoos = [];
      grid.innerHTML = `<div class="empty-state"><span>Connexion impossible</span>Le catalogue n'a pas pu se connecter à la base. Vérifie ta connexion et réessaie.</div>`;
      statsEl.textContent = '';
      return;
    }
    render();
  }

  function styleList(){
    return [...new Set(tattoos.map(t => t.style).filter(Boolean))];
  }

  function renderChips(){
    const styles = styleList();
    chipsEl.innerHTML = '';
    if(styles.length === 0){ chipsEl.innerHTML = '<span class="filter-label" style="opacity:.35;">Aucun style enregistré</span>'; }
    else{
      const allChip = document.createElement('button');
      allChip.className = 'chip' + (activeStyle === null ? ' active' : '');
      allChip.textContent = 'Tout';
      allChip.onclick = () => { activeStyle = null; render(); };
      chipsEl.appendChild(allChip);
      styles.forEach(s => {
        const c = document.createElement('button');
        c.className = 'chip' + (activeStyle === s ? ' active' : '');
        c.textContent = s;
        c.onclick = () => { activeStyle = (activeStyle === s ? null : s); render(); };
        chipsEl.appendChild(c);
      });
    }

    categoryChipsEl.innerHTML = '';
    const allCat = document.createElement('button');
    allCat.className = 'chip' + (activeCategory === null ? ' active' : '');
    allCat.textContent = 'Toutes';
    allCat.onclick = () => { activeCategory = null; render(); };
    categoryChipsEl.appendChild(allCat);
    CATEGORIES.forEach(cat => {
      const c = document.createElement('button');
      c.className = 'chip' + (activeCategory === cat ? ' active' : '');
      c.textContent = cat;
      const count = tattoos.filter(t => t.category === cat).length;
      if(count > 0) c.textContent += ` (${count})`;
      c.onclick = () => { activeCategory = (activeCategory === cat ? null : cat); render(); };
      categoryChipsEl.appendChild(c);
    });
  }

  function fmtDate(d){
    if(!d) return '—';
    const parts = d.split('-');
    if(parts.length !== 3) return d;
    return `${parts[2]}/${parts[1]}/${parts[0]}`;
  }

  function render(){
    renderChips();
    const q = searchInput.value.trim().toLowerCase();
    let list = [...tattoos];
    if(activeStyle) list = list.filter(t => t.style === activeStyle);
    if(activeCategory) list = list.filter(t => t.category === activeCategory);
    if(q){
      list = list.filter(t =>
        (t.title||'').toLowerCase().includes(q) ||
        (t.artist||'').toLowerCase().includes(q) ||
        (t.studio||'').toLowerCase().includes(q) ||
        (t.placement||'').toLowerCase().includes(q) ||
        (t.category||'').toLowerCase().includes(q) ||
        (t.style||'').toLowerCase().includes(q)
      );
    }
    list.sort((a,b) => (b.date||'').localeCompare(a.date||''));

    statsEl.innerHTML = `<b>${tattoos.length}</b> pièce${tattoos.length!==1?'s':''} au total<br>${styleList().length} style${styleList().length!==1?'s':''} représenté${styleList().length!==1?'s':''}`;

    grid.innerHTML = '';
    if(list.length === 0){
      grid.innerHTML = `<div class="empty-state"><span>Feuille vierge</span>Aucune pièce ici pour l'instant. Ajoutez votre premier tatouage.</div>`;
      return;
    }
    list.forEach((t, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="badge">${String(tattoos.indexOf(t)+1).padStart(2,'0')}</div>
        <div class="thumb">${t.image ? `<img src="${t.image}" alt="${escapeHtml(t.title)}">` : needleSVG}</div>
        <h3>${escapeHtml(t.title || 'Sans titre')}</h3>
        <div class="meta-line">${escapeHtml(t.category || '')}${t.style ? ' · ' + escapeHtml(t.style) : ''}</div>
        <div class="meta-line muted">${escapeHtml(t.placement || '')}</div>
      `;
      card.onclick = () => openDetail(t.id);
      grid.appendChild(card);
    });
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  // FORM MODAL
  const formOverlay = document.getElementById('formOverlay');
  const detailOverlay = document.getElementById('detailOverlay');
  const form = document.getElementById('tattooForm');
  const deleteBtn = document.getElementById('deleteBtn');

  function openForm(id){
    editingId = id || null;
    document.getElementById('formTitle').textContent = id ? 'Modifier la pièce' : 'Nouvelle pièce';
    deleteBtn.style.display = id ? 'inline-block' : 'none';
    if(id){
      const t = tattoos.find(x => x.id === id);
      document.getElementById('f-title').value = t.title || '';
      document.getElementById('f-image').value = t.image || '';
      document.getElementById('f-placement').value = t.placement || '';
      document.getElementById('f-category').value = t.category || 'Bras';
      document.getElementById('f-style').value = t.style || 'Fine line';
      document.getElementById('f-artist').value = t.artist || '';
      document.getElementById('f-studio').value = t.studio || '';
      document.getElementById('f-date').value = t.date || '';
      document.getElementById('f-notes').value = t.notes || '';
    } else {
      form.reset();
    }
    formOverlay.classList.add('open');
  }
  function closeForm(){ formOverlay.classList.remove('open'); editingId = null; }

  document.getElementById('openAdd').onclick = () => openForm(null);
  document.getElementById('closeForm').onclick = closeForm;
  document.getElementById('cancelForm').onclick = closeForm;
  formOverlay.addEventListener('click', e => { if(e.target === formOverlay) closeForm(); });

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const data = {
      title: document.getElementById('f-title').value.trim(),
      image: document.getElementById('f-image').value.trim(),
      placement: document.getElementById('f-placement').value.trim(),
      category: document.getElementById('f-category').value,
      style: document.getElementById('f-style').value,
      artist: document.getElementById('f-artist').value.trim(),
      studio: document.getElementById('f-studio').value.trim(),
      date: document.getElementById('f-date').value || null,
      notes: document.getElementById('f-notes').value.trim(),
    };
    const submitBtn = form.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Enregistrement…';
    try{
      if(editingId){
        const [updated] = await supa(`${TABLE}?id=eq.${editingId}`, {
          method:'PATCH',
          body: JSON.stringify(data)
        });
        const idx = tattoos.findIndex(x => x.id === editingId);
        if(idx > -1) tattoos[idx] = updated;
      } else {
        const [created] = await supa(`${TABLE}`, {
          method:'POST',
          body: JSON.stringify(data)
        });
        tattoos.unshift(created);
      }
      closeForm();
      render();
    }catch(err){
      console.error(err);
      alert("La sauvegarde a échoué. Vérifie ta connexion à la base et réessaie.");
    }finally{
      submitBtn.disabled = false;
      submitBtn.textContent = 'Enregistrer';
    }
  });

  deleteBtn.onclick = async () => {
    if(!editingId) return;
    if(confirm('Supprimer cette pièce du catalogue ?')){
      try{
        await supa(`${TABLE}?id=eq.${editingId}`, { method:'DELETE', prefer:'return=minimal' });
        tattoos = tattoos.filter(x => x.id !== editingId);
        closeForm();
        render();
      }catch(err){
        console.error(err);
        alert("La suppression a échoué. Réessaie.");
      }
    }
  };

  // DETAIL MODAL
  function openDetail(id){
    viewingId = id;
    const t = tattoos.find(x => x.id === id);
    if(!t) return;
    document.getElementById('d-title').textContent = t.title || 'Sans titre';
    const img = document.getElementById('d-image');
    if(t.image){ img.src = t.image; img.style.display = 'block'; } else { img.style.display = 'none'; }
    document.getElementById('d-category').textContent = t.category || '—';
    document.getElementById('d-placement').textContent = t.placement || '—';
    document.getElementById('d-style').textContent = t.style || '—';
    document.getElementById('d-artist').textContent = t.artist || '—';
    document.getElementById('d-studio').textContent = t.studio || '—';
    document.getElementById('d-date').textContent = fmtDate(t.date);
    document.getElementById('d-notes').textContent = t.notes || '';
    detailOverlay.classList.add('open');
  }
  document.getElementById('closeDetail').onclick = () => detailOverlay.classList.remove('open');
  detailOverlay.addEventListener('click', e => { if(e.target === detailOverlay) detailOverlay.classList.remove('open'); });
  document.getElementById('editFromDetail').onclick = () => {
    detailOverlay.classList.remove('open');
    openForm(viewingId);
  };

  searchInput.addEventListener('input', render);

  load();
})();
</script>
</body>
</html>
